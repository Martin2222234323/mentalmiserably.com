<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MENTAL MISERABLY - Gallery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #00e5ff; }
    header { background: white; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; flex-wrap: nowrap; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .header-left img.logo-icon { height: 50px; display: block; }
    .header-left img.avatar { height: 60px; }
    .header-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .lang-selector { font-size: 13px; font-weight: bold; font-style: italic; color: #333; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .lang-selector a { color: #0055ff; text-decoration: underline; }
    .header-right img { height: 60px; display: block; }
    .container { display: flex; padding: 20px; gap: 20px; }
    nav { display: flex; flex-direction: column; gap: 15px; width: 120px; }
    nav a { color: #0055ff; font-style: italic; font-weight: bold; text-decoration: underline; }
    main { flex: 1; background: white; border: 3px solid black; padding: 20px; display: flex; justify-content: space-between; font-style: italic; }
    .content { width: 65%; display: flex; flex-direction: column; gap: 15px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .gallery-grid img { width: 100%; height: 120px; object-fit: cover; border: 2px solid black; }
    .social-box { width: 30%; border: 2px solid black; padding: 15px; display: flex; flex-direction: column; gap: 15px; text-align: center; }
    .social-btn { padding: 12px; color: white; font-weight: bold; font-size: 18px; text-decoration: none; display: block; }
    .youtube { background: red; } .tiktok { background: black; } .discord { background: #3000ff; } .blog { background: #ff6600; }
    .footer-text { display: flex; justify-content: space-between; font-size: 12px; margin-top: auto; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="../images/logo-left.png" alt="axel" class="avatar">
      <div>
        <img src="../images/mentalmiserablyicon.png" alt="MENTAL MISERABLY" class="logo-icon">
      </div>
    </div>
    <div class="header-right">
      <div class="lang-selector">
        <span>select language:</span>
        <a href="../gallery.html">Español</a>
      </div>
      <img src="../images/top-right.png" alt="spykingphone">
    </div>
  </header>
  <div class="container">
    <nav>
      <a href="index.html">welcome</a>
      <a href="download.html">download</a>
      <a href="about.html">about</a>
      <a href="gallery.html">gallery</a>
    </nav>
    <main>
      <div class="content">
        <h2>GALLERY</h2>
        <p>screenshots and concept art from mental miserably:</p>
        <div class="gallery-grid">
          <img src="../images/galleryy1.png" alt="Screenshot 1">
          <img src="../images/galleryy2.png" alt="Screenshot 2">
          <img src="../images/galleryy3.png" alt="Screenshot 3">
          <img src="../images/galleryy4.png" alt="Screenshot 4">
        </div>
      </div>
      <div class="social-box">
        <a href="https://www.youtube.com/@echotophat" target="_blank" class="social-btn youtube">youtube</a>
        <a href="https://www.tiktok.com/@echotophat" target="_blank" class="social-btn tiktok">tiktok</a>
        <a href="https://discord.gg/tDxdAJMf8R" target="_blank" class="social-btn discord">discord</a>
        <a href="blog.html" class="social-btn blog">blog</a>
        <div class="footer-text">
          <span>im a tuff guy</span>
          <span>heh</span>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
